services:
  - type: web
    name: stagesight-web
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-transcribe
      - key: OPENAI_REPORT_MODEL
        value: gpt-5.6-terra
